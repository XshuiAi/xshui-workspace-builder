body[data-template="student-campus"] .home-hero { background-image: radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--accent) 48%, transparent) 0 2px, transparent 2.6px); background-size: 36px 36px; }
body[data-template="student-campus"] .hero-copy { padding: clamp(28px, 6vw, 72px); border-radius: 46% 54% 38% 62% / 56% 44% 56% 44%; background: color-mix(in srgb, var(--surface) 94%, transparent); box-shadow: var(--shadow); }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); }
.app-shell.collapsed { --sidebar-width: 86px; }
.sidebar { position: sticky; top: 0; display: flex; flex-direction: column; min-height: 100vh; max-height: 100vh; padding: 20px 14px; border-right: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 90%, var(--bg)); overflow: auto; }
.sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 18px; }
.sidebar-brand { display: flex; align-items: center; gap: 10px; min-width: 0; border: 0; background: transparent; color: inherit; text-align: left; }

.nav-item { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid transparent; border-radius: 13px; background: transparent; color: var(--muted); text-align: left; transition: background .18s, color .18s, border-color .18s; }
.nav-item:hover, .nav-item.active { border-color: var(--border); background: var(--surface); color: var(--ink); }
.nav-item.dragging { opacity: .45; }

.nav-icon { display: grid; flex: 0 0 24px; width: 24px; height: 24px; place-items: center; border-radius: 8px; background: var(--surface-soft); color: var(--accent-strong); font-size: 11px; font-weight: 800; }
.nav-copy { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar-footer { display: grid; gap: 8px; margin-top: auto; padding-top: 24px; }
.save-state { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 12px; background: var(--surface-soft); color: var(--muted); font-size: 11px; }
.save-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
.save-state.error .save-dot { background: var(--warning); }
.app-shell.collapsed .sidebar-brand-copy, .app-shell.collapsed .nav-label, .app-shell.collapsed .nav-copy, .app-shell.collapsed .save-state span:last-child, .app-shell.collapsed .sidebar-footer .button span { display: none; }
.app-shell.collapsed .sidebar-head { justify-content: center; }
.app-shell.collapsed .sidebar-brand { display: none; }
.app-shell.collapsed .nav-item { justify-content: center; padding-inline: 8px; }

.app-main { min-width: 0; padding: 26px clamp(18px, 4vw, 52px) 70px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 44px; }
.breadcrumb { color: var(--muted); font-size: 12px; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.mobile-menu { display: none; }
.page-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }

.page-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { min-width: 0; padding: 22px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: 0 1px 0 rgba(255,255,255,.8); }
.card.soft { background: var(--surface-soft); }

.summary-card { min-height: 150px; }
.summary-value { margin-top: 22px; font-family: var(--display-font); font-size: 44px; line-height: 1; }

.section-gap { margin-top: 18px; }
.split { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tag { display: inline-flex; align-items: center; min-height: 26px; padding: 4px 9px; border-radius: 999px; background: var(--surface-soft); color: var(--muted); font-size: 11px; }
.tag.success { background: color-mix(in srgb, var(--success) 15%, var(--surface)); color: var(--success); }
.tag.warning { background: color-mix(in srgb, var(--warning) 17%, var(--surface)); color: #9a4d37; }
.list { display: grid; gap: 10px; }
.record { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
.record:last-child { border-bottom: 0; }
.record-main { min-width: 0; }
.record-title { display: block; overflow-wrap: anywhere; font-weight: 700; }
.record-copy { display: -webkit-box; margin-top: 5px; overflow: hidden; color: var(--muted); font-size: 12px; line-height: 1.55; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.record-meta { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px; }
.record-actions { display: flex; gap: 5px; }
.empty { display: grid; min-height: 180px; place-items: center; padding: 24px; border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted); text-align: center; }
.toolbar-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.search { flex: 1 1 220px; }
.field, .select, .textarea { width: 100%; min-height: 42px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--ink); }
.textarea { min-height: 110px; resize: vertical; }
.field-label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
.form-grid { display: grid; gap: 14px; }
.form-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid .wide { grid-column: 1 / -1; }
.image-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.image-card { position: relative; grid-column: span 6; min-height: 210px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.image-card.size-s { grid-column: span 4; }
.image-card.size-l { grid-column: span 12; }
.image-card img { width: 100%; height: 100%; min-height: 210px; object-fit: cover; }
.image-card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; padding: 5px; border-radius: 999px; background: rgba(255,255,255,.92); box-shadow: 0 8px 20px rgba(0,0,0,.1); }
.image-card-actions button, .image-card-actions label { border: 0; background: transparent; color: #202020; font-size: 11px; cursor: pointer; }
body.editing .image-slot { min-height: 92px; padding: 8px; border: 1px dashed var(--border); border-radius: var(--radius); }
.image-slot.drop-target { border-color: var(--accent-strong); background: color-mix(in srgb, var(--accent) 13%, transparent); }
.image-slot-hint { grid-column: 1 / -1; display: grid; min-height: 74px; place-items: center; color: var(--muted); font-size: 12px; }
.image-card.dragging { opacity: .45; }
.optional-action { position: relative; display: inline-flex; }
.optional-hide { position: absolute; right: -7px; top: -22px; display: none; min-height: 22px; padding: 2px 7px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 10px; }
body.editing .optional-action:hover .optional-hide, body.editing .optional-action:focus-within .optional-hide { display: inline-flex; }

.modal-backdrop { position: fixed; inset: 0; z-index: 400; display: grid; place-items: center; padding: 20px; background: rgba(22,20,22,.38); backdrop-filter: blur(8px); }
.modal { width: min(680px, 100%); max-height: calc(100vh - 40px); overflow: auto; padding: 24px; border: 1px solid var(--border); border-radius: 24px; background: var(--surface); box-shadow: 0 28px 90px rgba(0,0,0,.2); }
.modal.wide { width: min(900px, 100%); }

  .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 250; width: min(300px, 88vw); max-height: none; transform: translateX(-105%); transition: transform .22s; box-shadow: 18px 0 50px rgba(0,0,0,.15); }
  .sidebar.open { transform: translateX(0); }
  .app-shell.collapsed .sidebar-brand-copy, .app-shell.collapsed .nav-label, .app-shell.collapsed .nav-copy, .app-shell.collapsed .save-state span:last-child, .app-shell.collapsed .sidebar-footer .button span { display: initial; }

  .app-shell.collapsed .sidebar-brand { display: flex; }
  .app-shell.collapsed .nav-item { justify-content: flex-start; padding-inline: 11px; }
  .mobile-menu { display: inline-flex; }
  .app-main { padding: 18px 16px 54px; }
  .topbar { margin-bottom: 30px; }
  .page-heading { display: block; }
  .page-actions { justify-content: flex-start; margin-top: 18px; }
  .grid.two, .grid.three, .form-grid.two, .import-modes { grid-template-columns: 1fr; }
  .record { grid-template-columns: 1fr; }
  .record-meta { justify-content: flex-start; }
  .image-card, .image-card.size-s, .image-card.size-l { grid-column: span 12; }
  .import-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .edit-bar .spacer { display: none; }
}

@media (max-width: 420px) {
  .home-nav { width: calc(100vw - 76px); justify-content: space-between; }
  .home-brand { min-width: 0; }
  .home-brand > span:last-child { max-width: calc(100vw - 190px); }
  .home-hero { padding-inline: 16px; }
  .hero-copy h1 { font-size: 48px; }
  .card { padding: 17px; }
  .import-summary { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .001ms !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
}

</style>

(function (global) {
  "use strict";

  const CURRENT_SCHEMA = 1;
  const WORKSPACE_KEY = "primary";
  let db = null;
  let config = null;
  let memoryState = null;

  const clone = (value) => JSON.parse(JSON.stringify(value));
  const now = () => new Date().toISOString();

  function safeJson(value, fallback) {
    try { return JSON.parse(value); } catch (_) { return fallback; }
  }

  function initialState(template) {
    return {
      schemaVersion: CURRENT_SCHEMA,
      profile: clone(template.profile),
      appearance: {
        templateId: template.templateId,
        sidebarCollapsed: false,
        textStyles: {},
        labels: {},
        hiddenActions: []
      },
      navigation: {
        order: template.modules.map((module) => module.id),
        hidden: []
      },
      modules: clone(template.modules),
      data: clone(template.demoData || {}),
      assets: [],
      updatedAt: now()
    };
  }

  function normalizeRecord(record, collection, index) {
    const createdAt = typeof record.createdAt === "string" ? record.createdAt : now();
    return {
      ...record,
      id: typeof record.id === "string" && record.id ? record.id : `${collection}-migrated-${index}-${Date.now()}`,
      createdAt,
      updatedAt: typeof record.updatedAt === "string" ? record.updatedAt : createdAt
    };
  }

  function migrateState(value, template) {
    if (!value || typeof value !== "object") return initialState(template);
    const base = initialState(template);
    const legacyCollections = ["tasks", "inbox", "journals", "goals", "growth", "reviews", "mediaIdeas", "mediaProjects", "mediaReviews", "meetings", "notices", "files", "projects", "assignments", "courses", "exams", "notes", "clubs"];
    const rawData = value.data && typeof value.data === "object" ? value.data : {};
    legacyCollections.forEach((key) => {
      if (!Array.isArray(rawData[key]) && Array.isArray(value[key])) rawData[key] = value[key];
    });
    const data = { ...base.data };
    Object.entries(rawData).forEach(([collection, records]) => {
      if (Array.isArray(records)) data[collection] = records.map((record, index) => normalizeRecord(record, collection, index));
    });
    const moduleIds = new Set(template.modules.map((module) => module.id));
    const incomingOrder = Array.isArray(value.navigation?.order) ? value.navigation.order.filter((id) => moduleIds.has(id)) : [];
    template.modules.forEach((module) => { if (!incomingOrder.includes(module.id)) incomingOrder.push(module.id); });
    const hidden = Array.isArray(value.navigation?.hidden)
      ? value.navigation.hidden.filter((id) => moduleIds.has(id) && !template.modules.find((module) => module.id === id)?.protected)
      : [];

      schemaVersion: CURRENT_SCHEMA,
      profile: { ...base.profile, ...(value.profile || {}) },
      appearance: {
        ...base.appearance,
        ...(value.appearance || {}),
        templateId: template.templateId,
        textStyles: value.appearance?.textStyles && typeof value.appearance.textStyles === "object" ? value.appearance.textStyles : {},
        labels: value.appearance?.labels && typeof value.appearance.labels === "object" ? value.appearance.labels : {},

      },
      navigation: { order: incomingOrder, hidden },
      modules: clone(template.modules),
      data,
      assets: Array.isArray(value.assets) ? value.assets.filter((item) => item && typeof item.id === "string" && typeof item.src === "string") : [],
      updatedAt: typeof value.updatedAt === "string" ? value.updatedAt : now()

  }

  function openDatabase(template) {
    if (!global.indexedDB) return Promise.resolve(null);
    const dbName = `xshui-workspace-${String(template.appId || template.templateId).replace(/[^a-z0-9-]/gi, "-")}`;
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(dbName, 1);
      request.onupgradeneeded = () => {
        const next = request.result;
        if (!next.objectStoreNames.contains("workspace")) next.createObjectStore("workspace");
        if (!next.objectStoreNames.contains("snapshots")) next.createObjectStore("snapshots", { keyPath: "id" });
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("无法打开 IndexedDB"));
    });
  }

  function requestResult(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result ?? null);
      request.onerror = () => reject(request.error || new Error("本地数据库操作失败"));
    });
  }

  async function init(template) {
    config = template;
    db = await openDatabase(template).catch(() => null);
    let stored = null;
    if (db) {
      const tx = db.transaction("workspace", "readonly");
      stored = await requestResult(tx.objectStore("workspace").get(WORKSPACE_KEY)).catch(() => null);
    }
    const embeddedNode = document.getElementById("xshui-embedded-state");
    const embedded = safeJson(embeddedNode?.textContent || "null", null);
    memoryState = migrateState(stored || embedded, template);
    try {
      const pref = safeJson(localStorage.getItem(`${template.appId}:preferences`) || "{}", {});
      if (typeof pref.sidebarCollapsed === "boolean") memoryState.appearance.sidebarCollapsed = pref.sidebarCollapsed;
    } catch (_) {}
    return clone(memoryState);
  }

  async function save(state) {
    memoryState = migrateState({ ...state, updatedAt: now() }, config);
    try {
      localStorage.setItem(`${config.appId}:preferences`, JSON.stringify({
        sidebarCollapsed: Boolean(memoryState.appearance.sidebarCollapsed),
        templateId: config.templateId,
        updatedAt: memoryState.updatedAt
      }));
      localStorage.setItem(`${config.appId}:recovery-config`, JSON.stringify({
        profile: memoryState.profile,
        appearance: memoryState.appearance,
        navigation: memoryState.navigation,
        updatedAt: memoryState.updatedAt
      }));
    } catch (_) {}
    if (!db) return { persistent: false, state: clone(memoryState) };
    await new Promise((resolve, reject) => {
      const tx = db.transaction("workspace", "readwrite");
      tx.objectStore("workspace").put(memoryState, WORKSPACE_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error || new Error("保存失败"));
      tx.onabort = () => reject(tx.error || new Error("保存被中断"));
    });
    return { persistent: true, state: clone(memoryState) };
  }

  async function createSnapshot(state, reason) {
    const snapshot = { id: `snapshot-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, createdAt: now(), reason: reason || "手动快照", state: clone(state) };
    if (!db) return snapshot;
    await new Promise((resolve, reject) => {
      const tx = db.transaction("snapshots", "readwrite");
      tx.objectStore("snapshots").put(snapshot);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error || new Error("创建快照失败"));
    });
    const snapshots = await listSnapshots();
    const overflow = snapshots.slice(5);
    if (overflow.length) {
      await new Promise((resolve) => {
        const tx = db.transaction("snapshots", "readwrite");
        overflow.forEach((item) => tx.objectStore("snapshots").delete(item.id));
        tx.oncomplete = resolve;
        tx.onerror = resolve;
      });
    }
    return snapshot;
  }

  async function listSnapshots() {
    if (!db) return [];
    const tx = db.transaction("snapshots", "readonly");
    const items = await requestResult(tx.objectStore("snapshots").getAll()).catch(() => []);
    return (items || []).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  }

  async function restoreSnapshot(id) {
    if (!db) throw new Error("当前浏览器没有可用的本地快照");
    const tx = db.transaction("snapshots", "readonly");
    const snapshot = await requestResult(tx.objectStore("snapshots").get(id));
    if (!snapshot?.state) throw new Error("找不到这个恢复快照");
    await save(snapshot.state);
    return clone(memoryState);
  }

  global.WorkspaceStore = {
    CURRENT_SCHEMA,
    init,
    save,
    initialState,
    migrateState,
    createSnapshot,
    listSnapshots,
    restoreSnapshot,
    clone,
    now
  };
})(window);

  <script>
(function (global) {
  "use strict";

  const FORMAT = "xshui-workspace-backup";
  const SUPPORTED_VERSIONS = new Set([1]);
  const clone = (value) => global.WorkspaceStore.clone(value);

  function envelope(state, template) {
    return {
      format: FORMAT,
      schemaVersion: 1,
      exportedAt: new Date().toISOString(),
      appVersion: template.appVersion || "1.0.0",
      templateId: template.templateId,
      profile: clone(state.profile),
      appearance: clone(state.appearance),
      navigation: clone(state.navigation),
      modules: clone(state.modules),
      data: clone(state.data),
      assets: clone(state.assets)
    };
  }

  function validatePackage(value) {
    if (!value || typeof value !== "object") throw new Error("备份不是有效的 JSON 对象");
    if (value.format !== FORMAT) throw new Error("不是 XShui 工作台备份");
    if (!SUPPORTED_VERSIONS.has(Number(value.schemaVersion))) throw new Error(`不支持的数据版本：${value.schemaVersion ?? "未知"}`);
    if (!value.profile || typeof value.profile !== "object") throw new Error("备份缺少 profile");
    if (!value.appearance || typeof value.appearance !== "object") throw new Error("备份缺少 appearance");
    if (!value.navigation || !Array.isArray(value.navigation.order) || !Array.isArray(value.navigation.hidden)) throw new Error("备份导航结构不完整");
    if (!Array.isArray(value.modules)) throw new Error("备份模块结构不完整");
    if (!value.data || typeof value.data !== "object" || Array.isArray(value.data)) throw new Error("备份数据结构不完整");
    for (const [collection, records] of Object.entries(value.data)) {
      if (!Array.isArray(records)) throw new Error(`数据集合 ${collection} 不是数组`);
      if (records.some((record) => !record || typeof record !== "object" || typeof record.id !== "string")) throw new Error(`数据集合 ${collection} 含无效记录`);
    }
    if (!Array.isArray(value.assets)) throw new Error("备份图片结构不完整");
    return value;
  }

  function legacyToPackage(value, template) {
    if (!value || typeof value !== "object") return null;
    const known = ["tasks", "inbox", "journals", "goals", "growths", "growth", "reviews", "mediaIdeas", "mediaProjects", "mediaReviews"];
    if (!known.some((key) => Array.isArray(value[key]))) return null;
    const state = global.WorkspaceStore.migrateState(value, template);
    return envelope(state, template);
  }

  function parseText(text, template) {
    let parsed;
    try { parsed = JSON.parse(text); } catch (_) { throw new Error("文件不是有效 JSON"); }
    if (parsed?.format === FORMAT) return validatePackage(parsed);
    const migrated = legacyToPackage(parsed, template);
    if (migrated) return migrated;
    throw new Error("无法识别这个备份文件");
  }

  function packageToState(pkg, template) {
    validatePackage(pkg);
    return global.WorkspaceStore.migrateState({
      schemaVersion: pkg.schemaVersion,
      profile: pkg.profile,
      appearance: pkg.appearance,
      navigation: pkg.navigation,
      modules: pkg.modules,
      data: pkg.data,
      assets: pkg.assets,
      updatedAt: pkg.exportedAt
    }, template);
  }

  function mergeById(current, incoming) {
    const map = new Map((current || []).map((item) => [item.id, item]));
    (incoming || []).forEach((item) => map.set(item.id, item));
    return Array.from(map.values());
  }

  function merge(current, incoming) {
    const next = clone(current);
    const collections = new Set([...Object.keys(current.data || {}), ...Object.keys(incoming.data || {})]);
    next.data = {};
    collections.forEach((collection) => {
      next.data[collection] = mergeById(current.data?.[collection] || [], incoming.data?.[collection] || []);
    });
    next.assets = mergeById(current.assets || [], incoming.assets || []);
    next.updatedAt = new Date().toISOString();
    return next;
  }

  function summary(state) {
    const collections = Object.fromEntries(Object.entries(state.data || {}).map(([key, records]) => [key, Array.isArray(records) ? records.length : 0]));
    return {
      collections,
      totalRecords: Object.values(collections).reduce((sum, count) => sum + count, 0),
      assets: Array.isArray(state.assets) ? state.assets.length : 0,
      modules: Array.isArray(state.modules) ? state.modules.length : 0
    };
  }

  function download(state, template) {
    const payload = envelope(state, template);
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `${template.templateId}-workbench-${new Date().toISOString().slice(0, 10)}.json`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 0);
    return payload;
  }

  global.WorkspaceBackup = { FORMAT, envelope, validatePackage, parseText, packageToState, merge, summary, download };
})(window);

  <script>
(function (global) {
  "use strict";

  let api = null;
  let editing = false;
  let selectedKey = "";
  let selectedNode = null;
  let undoStack = [];
  let redoStack = [];

  const clone = (value) => global.WorkspaceStore.clone(value);

  function init(nextApi) { api = nextApi; }
  function isEditing() { return editing; }

  function pushHistory() {
    if (!api) return;
    undoStack.push(clone(api.getState()));
    if (undoStack.length > 20) undoStack.shift();
    redoStack = [];
  }

  async function mutate(message, mutator) {
    pushHistory();
    const next = clone(api.getState());
    mutator(next);
    api.setState(next);
    api.render();
    await api.save(message || "修改已保存");
  }

  function enter() {
    if (editing) return;
    editing = true;
    document.body.classList.add("editing");
    api.render();
    api.toast("已进入编辑模式：点击文字或模块进行调整");
  }

  function exit() {
    if (!editing) return;
    editing = false;
    selectedKey = "";
    selectedNode = null;
    document.body.classList.remove("editing");
    api.render();
  }

  async function undo() {
    if (!undoStack.length) return api.toast("没有可以撤销的修改");
    redoStack.push(clone(api.getState()));
    const previous = undoStack.pop();
    api.setState(previous);
    api.render();
    await api.save("已撤销");
  }

  async function redo() {
    if (!redoStack.length) return api.toast("没有可以恢复的修改");
    undoStack.push(clone(api.getState()));
    const next = redoStack.pop();
    api.setState(next);
    api.render();
    await api.save("已恢复");
  }

  function select(node) {
    document.querySelectorAll(".editable-selected").forEach((item) => item.classList.remove("editable-selected"));

    selectedKey = node?.dataset?.editKey || "";

    const label = document.querySelector("[data-editor-selection]");
    if (label) label.textContent = selectedKey ? `已选择：${node.textContent.trim().slice(0, 18) || selectedKey}` : "先点击一段文字";
  }

  function afterRender() {

      node.addEventListener("click", (event) => {
        event.stopPropagation();
        select(node);
      });
      node.addEventListener("blur", () => {
        const key = node.dataset.editKey;
        const value = node.textContent.trim();
        if (!key || !value || api.getState().appearance.labels[key] === value) return;
        mutate("文字已保存", (state) => { state.appearance.labels[key] = value; });
      });

      reader.onerror = () => reject(new Error("读取图片失败"));
      reader.readAsDataURL(file);
    });
  }

  async function compressImage(file) {
    if (!file?.type?.startsWith("image/")) throw new Error("请选择图片文件");
    if (file.size > 10 * 1024 * 1024) throw new Error("单张图片不能超过 10MB");
    const source = await readFile(file);
    const image = new Image();
    await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = () => reject(new Error("图片无法解码")); image.src = source; });
    const limit = 1600;
    const scale = Math.min(1, limit / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/webp", .82);
  }

  async function addImage(file) {
    try {
      const src = await compressImage(file);
      await mutate("图片已插入", (state) => {
        state.assets.push({ id: `asset-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, src, alt: file.name.replace(/\.[^.]+$/, ""), pageId: api.getRoute(), size: "m", createdAt: new Date().toISOString() });
      });
    } catch (error) { api.toast(error.message || "插入图片失败"); }
  }

  async function resizeImage(id, size) {
    if (!["s", "m", "l"].includes(size)) return;
    await mutate("图片尺寸已调整", (state) => {
      const asset = state.assets.find((item) => item.id === id);
      if (asset) asset.size = size;
    });
  }

  async function replaceImage(id, file) {
    try {
      const src = await compressImage(file);
      await mutate("图片已替换", (state) => {
        const asset = state.assets.find((item) => item.id === id);
        if (asset) {
          asset.src = src;
          asset.alt = file.name.replace(/\.[^.]+$/, "");
          asset.updatedAt = new Date().toISOString();
        }
      });
    } catch (error) { api.toast(error.message || "替换图片失败"); }
  }

  async function removeImage(id) {
    await mutate("图片已移除", (state) => { state.assets = state.assets.filter((item) => item.id !== id); });
  }

  function exportHtml() {
    const cloneRoot = document.documentElement.cloneNode(true);
    cloneRoot.querySelector(".edit-bar")?.remove();
    cloneRoot.querySelectorAll(".modal-backdrop").forEach((node) => node.remove());
    cloneRoot.querySelectorAll(".editable-selected").forEach((node) => node.classList.remove("editable-selected"));
    cloneRoot.querySelectorAll("[contenteditable]").forEach((node) => node.removeAttribute("contenteditable"));
    cloneRoot.querySelector("body")?.classList.remove("editing");
    const stateNode = cloneRoot.querySelector("#xshui-embedded-state");
    if (stateNode) stateNode.textContent = JSON.stringify(api.getState()).replace(/</g, "\\u003c");
    const html = `<!doctype html>\n${cloneRoot.outerHTML}`;
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `${api.getTemplate().templateId}-edited-workbench.html`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 0);
    api.toast("已导出包含当前配置与数据的 HTML，请妥善保管");
  }

  function toolbar() {
    if (!editing) return "";
    return `<div class="edit-bar" role="toolbar" aria-label="工作台编辑工具栏">
      <button class="button small primary" data-editor-action="exit">退出编辑</button>
      <span class="edit-bar-label" data-editor-selection>先点击一段文字</span>
      <button class="button small" data-editor-action="font-down">字号－</button>
      <button class="button small" data-editor-action="font-up">字号＋</button>
      <button class="button small" data-editor-action="line-down">行距－</button>
      <button class="button small" data-editor-action="line-up">行距＋</button>
      <button class="button small" data-editor-action="reset-style">恢复字号</button>
      <button class="button small" data-editor-action="undo" title="最多撤销 20 步">↶ 撤销</button>
      <button class="button small" data-editor-action="redo">↷ 恢复</button>
      <label class="button small">＋ 图片<input class="visually-hidden" type="file" accept="image/*" data-editor-image></label>
      <button class="button small" data-editor-action="hidden">已隐藏内容</button>
      <span class="spacer"></span>
      <button class="button small" data-editor-action="export-html">导出 HTML</button>
    </div>`;
  }

  function handleAction(action) {
    if (action === "exit") exit();
    if (action === "font-down") adjustStyle("fontSize", -1, false);
    if (action === "font-up") adjustStyle("fontSize", 1, false);
    if (action === "line-down") adjustStyle("lineHeight", -1, false);
    if (action === "line-up") adjustStyle("lineHeight", 1, false);
    if (action === "reset-style") { adjustStyle("fontSize", 0, true); adjustStyle("lineHeight", 0, true); }
    if (action === "undo") undo();
    if (action === "redo") redo();
    if (action === "hidden") api.openHiddenModules();
    if (action === "export-html") exportHtml();
  }

  global.WorkspaceEditor = { init, isEditing, enter, exit, afterRender, mutate, undo, redo, toolbar, handleAction, hideModule, restoreModule, hideAction, restoreAction, addImage, replaceImage, resizeImage, removeImage, exportHtml };
})(window);

</script>
  <script>
(function () {
  "use strict";

  const config = JSON.parse(document.getElementById("workspace-template").textContent);
  const app = document.getElementById("app");
  const toastNode = document.getElementById("toast");
  let state = null;
  let route = parseRoute();
  let saveStatus = { type: "ok", label: "本地模式" };
  let currentModal = null;
  let pendingImport = null;
  let query = "";
  let filter = "全部";
  let draggedNav = "";
  let draggedAsset = "";

  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
  const uid = (prefix) => `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const dateText = (value) => value ? new Intl.DateTimeFormat("zh-CN", { month: "short", day: "numeric" }).format(new Date(`${String(value).slice(0, 10)}T12:00:00`)) : "未设置日期";
  const moduleById = (id) => config.modules.find((module) => module.id === id);
  const currentModule = () => moduleById(route);
  const label = (key, fallback) => state?.appearance?.labels?.[key] || fallback;
  const styleText = (key) => {
    const style = state?.appearance?.textStyles?.[key] || {};
    return Object.entries(style).map(([name, value]) => `${name.replace(/[A-Z]/g, (char) => `-${char.toLowerCase()}`)}:${value}`).join(";");
  };
  const editAttr = (key) => `data-edit-key="${esc(key)}" style="${esc(styleText(key))}"`;

  function applyTheme() {
    const theme = config.theme;
    const root = document.documentElement;
    const mapping = { bg: "--bg", surface: "--surface", surfaceSoft: "--surface-soft", ink: "--ink", muted: "--muted", accent: "--accent", accentStrong: "--accent-strong", success: "--success", warning: "--warning", border: "--border", radius: "--radius", displayFont: "--display-font", bodyFont: "--body-font" };
    Object.entries(mapping).forEach(([key, cssVar]) => root.style.setProperty(cssVar, theme[key]));
    document.body.dataset.template = config.templateId;
    document.title = state?.profile?.title || config.profile.title;
  }

  function parseRoute() {
    const raw = location.hash.replace(/^#/, "");
    return raw || "home";
  }

  function navigate(next) {
    if (!moduleById(next) && next !== "home") next = config.home.primaryAction.route;
    location.hash = next === "home" ? "home" : next;
    if (location.hash === `#${next}`) {
      route = next;
      render();
    }
  }

  function toast(message) {
    toastNode.textContent = message;
    toastNode.classList.add("show");
    clearTimeout(toastNode._timer);
    toastNode._timer = setTimeout(() => toastNode.classList.remove("show"), 2800);
  }

  function updateSaveBadge() {
    document.querySelectorAll("[data-save-state]").forEach((node) => {
      node.className = `save-state ${saveStatus.type === "error" ? "error" : ""}`;
      node.innerHTML = `<span class="save-dot"></span><span>${esc(saveStatus.label)}</span>`;
    });
  }

  async function save(message) {
    saveStatus = { type: "ok", label: "正在保存…" };
    updateSaveBadge();
    try {
      const result = await WorkspaceStore.save(state);
      saveStatus = result.persistent ? { type: "ok", label: "已保存到本机" } : { type: "error", label: "临时模式：浏览器未提供 IndexedDB" };
      if (message) toast(message);
    } catch (error) {
      saveStatus = { type: "error", label: "保存失败" };
      toast(`保存失败：${error.message || "请立即导出备份"}`);
    }
    updateSaveBadge();
  }

  function visibleModules() {
    const hidden = new Set(state.navigation.hidden || []);
    return state.navigation.order.map(moduleById).filter((module) => module && !hidden.has(module.id));
  }

  function groupedModules() {
    const groups = new Map();
    visibleModules().forEach((module) => {
      if (!groups.has(module.group)) groups.set(module.group, []);
      groups.get(module.group).push(module);
    });
    return groups;
  }

  function moduleLabel(module) { return label(`module.${module.id}.label`, module.label); }
  function moduleDescription(module) { return label(`module.${module.id}.description`, module.description); }

  function icon(name) {
    const paths = {
      home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
      menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      edit: '<path d="m4 20 4.5-1 10-10a2 2 0 0 0-3-3l-10 10L4 20Z"/><path d="m14 7 3 3"/>',
      trash: '<path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/>',
      check: '<path d="m5 12 4 4L19 6"/>',
      backup: '<path d="M12 3v12m0 0 5-5m-5 5-5-5"/><path d="M5 20h14"/>',
      collapse: '<path d="m14 6-6 6 6 6"/>',
      image: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1"/>'
    };
    return `<svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.home}</svg>`;
  }

  function imageCards(pageId) {
    const assets = state.assets.filter((asset) => asset.pageId === pageId);
    if (!assets.length && !WorkspaceEditor.isEditing()) return "";
    const emptyHint = WorkspaceEditor.isEditing() && !assets.length ? `<div class="image-slot-hint">把图片拖到这里，或用顶部“＋ 图片”插入</div>` : "";
    return `<section class="image-grid image-slot" data-image-slot="${esc(pageId)}" aria-label="图片卡片">${emptyHint}${assets.map((asset) => `<article class="image-card size-${esc(asset.size || "m")}" draggable="${WorkspaceEditor.isEditing()}" data-asset-id="${esc(asset.id)}"><img src="${esc(asset.src)}" alt="${esc(asset.alt || "用户插入的图片")}">${WorkspaceEditor.isEditing() ? `<div class="image-card-actions"><button data-action="image-size" data-id="${esc(asset.id)}" data-size="s">小</button><button data-action="image-size" data-id="${esc(asset.id)}" data-size="m">中</button><button data-action="image-size" data-id="${esc(asset.id)}" data-size="l">大</button><label>换<input class="visually-hidden" type="file" accept="image/*" data-image-replace="${esc(asset.id)}"></label><button data-action="image-remove" data-id="${esc(asset.id)}">删</button></div>` : ""}</article>`).join("")}</section>`;
  }

  function optionalAction(id, html) {
    if (state.appearance.hiddenActions.includes(id)) return "";
    return `<span class="optional-action" data-optional-action="${esc(id)}">${html}${WorkspaceEditor.isEditing() ? `<button class="optional-hide" data-action="hide-action" data-action-id="${esc(id)}" title="隐藏这个可选按钮">隐藏</button>` : ""}</span>`;
  }

  function renderHome() {
    const ownerTitle = label("profile.title", state.profile.title);
    const headline = label("home.headline", config.home.headline);
    const [first, ...rest] = headline.split(/[，,]/);
    const renderedHeadline = rest.length ? `${esc(first)}，<span>${esc(rest.join("，"))}</span>` : `<span>${esc(headline)}</span>`;
    return `${WorkspaceEditor.toolbar()}<div class="home-page"><nav class="home-nav" aria-label="首页导航"><button class="home-brand" data-action="home"><span class="brand-mark">${esc(Array.from(state.profile.ownerName || "我")[0])}</span><span ${editAttr("profile.title")}>${esc(ownerTitle)}</span></button><a class="home-nav-link" href="#${esc(config.home.primaryAction.route)}">今日</a><a class="home-nav-link" href="#${esc(config.home.secondaryAction.route)}">工作台</a><button class="button small" data-action="edit-mode">${icon("edit")} 编辑</button></nav><main class="home-hero" id="main-content"><section class="hero-copy"><span class="eyebrow" ${editAttr("home.eyebrow")}>${esc(label("home.eyebrow", config.home.eyebrow))}</span><h1 ${editAttr("home.headline")}>${renderedHeadline}</h1><p ${editAttr("home.description")}>${esc(label("home.description", config.home.description))}</p><div class="hero-date">${new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "long", day: "numeric", weekday: "long" }).format(new Date())}</div><div class="hero-actions"><button class="button primary" data-action="go" data-route="${esc(config.home.primaryAction.route)}"><span ${editAttr("home.primaryAction")}>${esc(label("home.primaryAction", config.home.primaryAction.label))}</span> →</button>${optionalAction("home.secondary", `<button class="button" data-action="go" data-route="${esc(config.home.secondaryAction.route)}"><span ${editAttr("home.secondaryAction")}>${esc(label("home.secondaryAction", config.home.secondaryAction.label))}</span></button>`)}</div><div class="home-footnote">数据保存在当前浏览器 · 可随时导出 JSON</div>${imageCards("home")}</section></main></div>`;
  }

  function renderSidebar() {
    const groups = groupedModules();
    return `<aside class="sidebar" id="sidebar"><div class="sidebar-head"><button class="sidebar-brand" data-action="home"><span class="brand-mark">${esc(Array.from(state.profile.ownerName || "我")[0])}</span><span class="sidebar-brand-copy"><strong>${esc(label("profile.title", state.profile.title))}</strong><small>${esc(state.profile.scene)}</small></span></button><button class="button icon small sidebar-toggle" data-action="sidebar-toggle" aria-label="收起或展开边栏">${icon("collapse")}</button></div>${Array.from(groups.entries()).map(([group, modules]) => `<section class="nav-group"><span class="nav-label">${esc(group)}</span><nav class="sidebar-nav" aria-label="${esc(group)}">${modules.map((module) => `<button class="nav-item ${route === module.id ? "active" : ""}" data-action="go" data-route="${esc(module.id)}" data-nav-id="${esc(module.id)}" draggable="${WorkspaceEditor.isEditing()}" title="${WorkspaceEditor.isEditing() ? "拖动调整顺序" : moduleLabel(module)}"><span class="nav-icon">${esc(moduleLabel(module).slice(0, 1))}</span><span class="nav-copy" ${editAttr(`module.${module.id}.label`)}>${esc(moduleLabel(module))}</span></button>`).join("")}</nav></section>`).join("")}<footer class="sidebar-footer"><div class="save-state" data-save-state><span class="save-dot"></span><span>${esc(saveStatus.label)}</span></div><button class="button small" data-action="edit-mode">${icon("edit")}<span>编辑工作台</span></button><button class="button small" data-action="home">${icon("home")}<span>回到首页</span></button></footer></aside>`;
  }

  function renderShell(content) {
    return `${WorkspaceEditor.toolbar()}<div class="app-shell ${state.appearance.sidebarCollapsed ? "collapsed" : ""}">${renderSidebar()}<section class="app-main"><header class="topbar"><div class="breadcrumb"><button class="button icon small mobile-menu" data-action="mobile-menu" aria-label="打开菜单">${icon("menu")}</button> ${esc(state.profile.scene)} / <strong>${esc(moduleLabel(currentModule() || config.modules[0]))}</strong></div><div class="top-actions"><button class="button small" data-action="edit-mode">${icon("edit")} 编辑</button></div></header><main id="main-content">${content}</main></section></div>`;
  }

  function recordsFor(module) { return Array.isArray(state.data[module.collection]) ? state.data[module.collection] : []; }
  function recordSummary(record) { return record.note || record.description || record.source || record.course || record.owner || record.tags || record.url || ""; }
  function recordStatus(record) { return record.status || record.priority || record.period || "本地记录"; }
  function isDone(record) { return ["已完成", "已处理", "已传达", "已归档"].includes(record.status); }

  function recordRows(module, records) {
    if (!records.length) return `<div class="empty"><div><strong>这里还没有内容。</strong><br><span>点击“新增”写下第一条记录。</span></div></div>`;
    return `<div class="list">${records.map((record) => `<article class="record"><div class="record-main"><strong class="record-title">${esc(record.title || "未命名记录")}</strong><span class="record-copy">${esc(recordSummary(record))}</span></div><div class="record-meta"><span class="tag ${isDone(record) ? "success" : record.priority === "紧急" || record.priority === "高" ? "warning" : ""}">${esc(recordStatus(record))}</span>${record.dueDate ? `<span class="tag">${esc(dateText(record.dueDate))}</span>` : ""}<span class="record-actions">${module.fields.some((field) => field.key === "status") ? `<button class="button icon small" data-action="toggle-record" data-module="${esc(module.id)}" data-id="${esc(record.id)}" aria-label="切换完成状态">${icon("check")}</button>` : ""}<button class="button icon small" data-action="edit-record" data-module="${esc(module.id)}" data-id="${esc(record.id)}" aria-label="编辑">${icon("edit")}</button><button class="button icon small danger" data-action="delete-record" data-module="${esc(module.id)}" data-id="${esc(record.id)}" aria-label="删除">${icon("trash")}</button></span></div></article>`).join("")}</div>`;
  }

  function moduleEditHandle(module) {
    if (!WorkspaceEditor.isEditing() || module.protected) return "";
    return `<div class="module-edit-handle"><button class="button small" data-action="hide-module" data-module="${esc(module.id)}">隐藏模块</button></div>`;
  }

  function pageHeading(module, actions) {
    return `<header class="page-heading" data-module-id="${esc(module.id)}">${moduleEditHandle(module)}<div><span class="eyebrow">${esc(module.group)}</span><h1 ${editAttr(`module.${module.id}.label`)}>${esc(moduleLabel(module))}</h1><p ${editAttr(`module.${module.id}.description`)}>${esc(moduleDescription(module))}</p></div><div class="page-actions">${actions || ""}</div></header>`;
  }

  function renderToday(module) {
    const records = recordsFor(module);
    const all = Object.values(state.data).flatMap((items) => Array.isArray(items) ? items : []);
    const dueToday = all.filter((item) => item.dueDate === today() && !isDone(item)).length;
    const done = records.filter(isDone).length;
    const active = records.length - done;
    const recent = [...all].sort((a, b) => String(b.updatedAt || b.createdAt).localeCompare(String(a.updatedAt || a.createdAt))).slice(0, 5);
    const addAction = optionalAction(`module.${module.id}.new`, `<button class="button primary" data-action="new-record" data-module="${esc(module.id)}">${icon("plus")} 新增事项</button>`);
    return `${pageHeading(module, addAction)}<section class="grid three"><article class="card summary-card soft"><span class="summary-label">今天到期</span><div class="summary-value">${dueToday}</div></article><article class="card summary-card"><span class="summary-label">正在推进</span><div class="summary-value">${active}</div></article><article class="card summary-card"><span class="summary-label">已经完成</span><div class="summary-value">${done}</div></article></section><section class="grid two section-gap"><article class="card"><div class="split"><h2>今日重点</h2><span class="tag">${records.length} 条</span></div>${recordRows(module, records.slice(0, 5))}</article><article class="card"><div class="split"><h2>最近更新</h2><span class="tag">全工作台</span></div>${recent.length ? `<div class="list">${recent.map((item) => `<div class="record"><div class="record-main"><strong class="record-title">${esc(item.title || "未命名")}</strong><span class="record-copy">${esc(recordSummary(item))}</span></div><span class="tag">${esc(recordStatus(item))}</span></div>`).join("")}</div>` : `<div class="empty">还没有更新。</div>`}</article></section>${imageCards(module.id)}`;
  }

  function renderModule(module) {
    if (module.archive) return renderArchive(module);
    const records = recordsFor(module).filter((record) => {
      const matchesQuery = !query || JSON.stringify(record).toLowerCase().includes(query.toLowerCase());
      const matchesFilter = filter === "全部" || record.status === filter || record.priority === filter;
      return matchesQuery && matchesFilter;
    });
    const statusField = module.fields.find((field) => field.key === "status" || field.key === "priority");
    const addAction = optionalAction(`module.${module.id}.new`, `<button class="button primary" data-action="new-record" data-module="${esc(module.id)}">${icon("plus")} 新增</button>`);
    return `${pageHeading(module, addAction)}<section class="card"><div class="toolbar-row"><label class="visually-hidden" for="workspace-search">搜索</label><input id="workspace-search" class="field search" data-search placeholder="搜索当前模块" value="${esc(query)}">${statusField ? `<select class="select" data-filter aria-label="筛选"><option>全部</option>${statusField.options.map((option) => `<option ${filter === option ? "selected" : ""}>${esc(option)}</option>`).join("")}</select>` : ""}<span class="tag">${records.length} 条</span></div>${recordRows(module, records)}</section>${imageCards(module.id)}`;
  }

  function renderArchive(module) {
    return `${pageHeading(module, `<button class="button" data-action="backup-export">${icon("backup")} 导出 JSON</button><label class="button primary">导入 JSON<input class="visually-hidden" type="file" accept="application/json,.json" data-backup-file></label>`)}<div class="notice"><strong>数据只保存在当前浏览器。</strong> 更换浏览器、清理站点数据或换端口前，请先导出备份。导入不会立即修改数据，会先显示摘要并让你选择合并或完整恢复。</div><section class="grid two section-gap"><article class="card"><h2>完整备份</h2><p>包含姓名、外观、导航、全部记录和已压缩图片。</p><button class="button primary" data-action="backup-export">导出 JSON</button></article><article class="card"><h2>恢复快照</h2><p>完整恢复前自动创建，最多保留最近 5 次。</p><button class="button" data-action="snapshots">查看恢复快照</button></article></section><section class="card section-gap"><h2>各模块记录</h2><div class="grid three">${config.modules.filter((item) => !item.archive).map((item) => `<div class="card soft"><span class="summary-label">${esc(moduleLabel(item))}</span><div class="summary-value">${recordsFor(item).length}</div></div>`).join("")}</div></section>${imageCards(module.id)}`;
  }

  function render() {
    applyTheme();
    if (route === "home") app.innerHTML = renderHome();
    else {
      const module = currentModule() || moduleById(config.home.primaryAction.route);
      if (state.navigation.hidden.includes(module.id)) route = config.home.primaryAction.route;
      const content = module.summary ? renderToday(module) : renderModule(module);
      app.innerHTML = renderShell(content);
    }
    app.setAttribute("aria-busy", "false");
    applyTextStyles();
    WorkspaceEditor.afterRender();
    updateSaveBadge();
  }

  function applyTextStyles() {
    Object.entries(state.appearance.textStyles || {}).forEach(([key, styles]) => {
      document.querySelectorAll(`[data-edit-key="${globalThis.CSS?.escape ? CSS.escape(key) : key}"]`).forEach((node) => Object.assign(node.style, styles));
    });
  }

  function fieldControl(field, value) {
    const common = `name="${esc(field.key)}" ${field.required ? "required" : ""}`;
    if (field.type === "textarea") return `<textarea class="textarea" ${common}>${esc(value || "")}</textarea>`;
    if (field.type === "select") return `<select class="select" ${common}>${field.options.map((option) => `<option ${value === option ? "selected" : ""}>${esc(option)}</option>`).join("")}</select>`;
    return `<input class="field" type="${esc(field.type || "text")}" ${common} value="${esc(value || "")}" ${field.type === "url" ? "inputmode=\"url\"" : ""}>`;
  }

  function openRecordModal(moduleId, recordId) {
    const module = moduleById(moduleId);
    const record = recordId ? recordsFor(module).find((item) => item.id === recordId) : null;
    const title = record ? `编辑${moduleLabel(module)}` : `新增${moduleLabel(module)}`;
    openModal(`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="record-modal-title"><header class="modal-head"><div><span class="eyebrow">LOCAL RECORD</span><h2 id="record-modal-title">${esc(title)}</h2><p>保存后会立即写入当前浏览器。</p></div><button class="button icon" data-action="modal-close" aria-label="关闭">×</button></header><form class="form-grid two" data-record-form data-module="${esc(moduleId)}" data-id="${esc(recordId || "")}">${module.fields.map((field) => `<label class="field-label ${field.type === "textarea" ? "wide" : ""}"><span>${esc(field.label)}${field.required ? " *" : ""}</span>${fieldControl(field, record?.[field.key])}</label>`).join("")}<div class="modal-actions wide"><button class="button" type="button" data-action="modal-close">取消</button><button class="button primary" type="submit">保存</button></div></form></section>`);
  }

  function openModal(content) {
    closeModal();
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = content;
    backdrop.addEventListener("mousedown", (event) => { if (event.target === backdrop) closeModal(); });
    document.body.appendChild(backdrop);
    currentModal = backdrop;
    backdrop.querySelector("input, textarea, select, button")?.focus();
  }

  function closeModal() { currentModal?.remove(); currentModal = null; pendingImport = null; }

  async function submitRecord(form) {
    const module = moduleById(form.dataset.module);
    const values = Object.fromEntries(new FormData(form).entries());
    const now = new Date().toISOString();
    if (!state.data[module.collection]) state.data[module.collection] = [];
    const existing = form.dataset.id ? state.data[module.collection].find((item) => item.id === form.dataset.id) : null;
    if (existing) Object.assign(existing, values, { updatedAt: now });
    else state.data[module.collection].unshift({ ...values, id: uid(module.collection), createdAt: now, updatedAt: now });
    closeModal();
    render();
    await save(existing ? "记录已更新" : "记录已保存");
  }

  async function deleteRecord(moduleId, id) {
    const module = moduleById(moduleId);
    const record = recordsFor(module).find((item) => item.id === id);
    if (!record || !confirm(`确定删除“${record.title || "这条记录"}”吗？此操作可以通过 JSON 备份恢复。`)) return;
    state.data[module.collection] = recordsFor(module).filter((item) => item.id !== id);
    render();
    await save("记录已删除");
  }

  async function toggleRecord(moduleId, id) {
    const module = moduleById(moduleId);
    const record = recordsFor(module).find((item) => item.id === id);
    if (!record) return;
    const statusField = module.fields.find((field) => field.key === "status");
    const options = statusField?.options || ["待处理", "已完成"];
    const completedValue = options.at(-1) || "已完成";
    const completed = record.status === completedValue || isDone(record);
    record.status = completed ? (options[0] || "待处理") : completedValue;
    record.updatedAt = new Date().toISOString();
    render();
    await save(completed ? "已恢复为未完成" : "已标记完成");
  }

  function openImportPreview(pkg) {
    const incoming = WorkspaceBackup.packageToState(pkg, config);
    const incomingSummary = WorkspaceBackup.summary(incoming);
    const currentSummary = WorkspaceBackup.summary(state);
    pendingImport = incoming;
    const collections = Array.from(new Set([...Object.keys(currentSummary.collections), ...Object.keys(incomingSummary.collections)])).slice(0, 9);
    openModal(`<section class="modal wide" role="dialog" aria-modal="true" aria-labelledby="import-title"><header class="modal-head"><div><span class="eyebrow">IMPORT PREVIEW</span><h2 id="import-title">确认要导入的备份</h2><p>${esc(pkg.templateId)} · 数据版本 ${esc(pkg.schemaVersion)} · ${esc(pkg.exportedAt.slice(0, 10))}</p></div><button class="button icon" data-action="modal-close" aria-label="关闭">×</button></header><div class="import-summary">${collections.map((key) => `<article><span>${esc(moduleLabel(config.modules.find((module) => module.collection === key) || { id: key, label: key }))}</span><strong>${incomingSummary.collections[key] || 0}</strong><small>当前 ${currentSummary.collections[key] || 0}</small></article>`).join("")}<article><span>图片</span><strong>${incomingSummary.assets}</strong><small>当前 ${currentSummary.assets}</small></article></div><div class="import-modes"><button class="import-mode" data-action="import-apply" data-mode="merge"><span class="tag success">推荐</span><strong>合并导入</strong><p>保留当前姓名、外观、导航和模块；相同 ID 使用备份记录，其余记录合并保留。</p></button><button class="import-mode" data-action="import-apply" data-mode="replace"><span class="tag warning">完整恢复</span><strong>覆盖当前工作台</strong><p>先创建恢复快照，再用备份中的设置和数据替换当前工作台。</p></button></div><footer class="modal-actions"><button class="button" data-action="modal-close">取消</button></footer></section>`);
    pendingImport = incoming;
  }

  async function applyImport(mode) {
    if (!pendingImport) return;
    const incoming = pendingImport;
    if (mode === "replace") await WorkspaceStore.createSnapshot(state, "完整恢复前自动快照");
    state = mode === "merge" ? WorkspaceBackup.merge(state, incoming) : incoming;
    closeModal();
    render();
    await save(mode === "merge" ? "备份数据已合并" : "工作台已完整恢复");
  }

  async function openSnapshots() {
    const snapshots = await WorkspaceStore.listSnapshots();
    openModal(`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="snapshot-title"><header class="modal-head"><div><span class="eyebrow">RECOVERY</span><h2 id="snapshot-title">恢复快照</h2><p>完整恢复前自动保存，最多 5 份。</p></div><button class="button icon" data-action="modal-close">×</button></header>${snapshots.length ? `<div class="list">${snapshots.map((item) => `<div class="record"><div class="record-main"><strong class="record-title">${esc(item.reason)}</strong><span class="record-copy">${esc(new Date(item.createdAt).toLocaleString("zh-CN"))}</span></div><button class="button small" data-action="snapshot-restore" data-id="${esc(item.id)}">恢复</button></div>`).join("")}</div>` : `<div class="empty">还没有恢复快照。</div>`}<footer class="modal-actions"><button class="button" data-action="modal-close">关闭</button></footer></section>`);
  }

  async function restoreSnapshot(id) {
    if (!confirm("恢复这个快照会替换当前工作台，是否继续？")) return;
    try {
      state = await WorkspaceStore.restoreSnapshot(id);
      closeModal();
      render();
      toast("快照已恢复");
    } catch (error) { toast(error.message || "恢复失败"); }
  }

  function openHiddenModules() {
    const hidden = state.navigation.hidden.map(moduleById).filter(Boolean);
    const actionLabels = new Map([["home.secondary", "首页：第二个入口按钮"]]);
    config.modules.forEach((module) => actionLabels.set(`module.${module.id}.new`, `${moduleLabel(module)}：新增按钮`));
    const hiddenActions = state.appearance.hiddenActions || [];
    openModal(`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="hidden-title"><header class="modal-head"><div><span class="eyebrow">HIDDEN CONTENT</span><h2 id="hidden-title">已隐藏内容</h2><p>隐藏不会删除记录，恢复后内容会重新出现。备份与恢复等核心入口不能隐藏。</p></div><button class="button icon" data-action="modal-close">×</button></header>${hidden.length || hiddenActions.length ? `<div class="hidden-list">${hidden.map((module) => `<div class="hidden-row"><span>模块：${esc(moduleLabel(module))}</span><button class="button small" data-action="restore-module" data-module="${esc(module.id)}">恢复</button></div>`).join("")}${hiddenActions.map((id) => `<div class="hidden-row"><span>按钮：${esc(actionLabels.get(id) || id)}</span><button class="button small" data-action="restore-action" data-action-id="${esc(id)}">恢复</button></div>`).join("")}</div>` : `<div class="empty">没有隐藏的模块或按钮。</div>`}<footer class="modal-actions"><button class="button" data-action="modal-close">关闭</button></footer></section>`);
  }

  async function reorderNavigation(source, target) {
    if (!source || !target || source === target) return;
    await WorkspaceEditor.mutate("导航顺序已保存", (next) => {
      const order = [...next.navigation.order];
      const from = order.indexOf(source);
      const to = order.indexOf(target);
      if (from < 0 || to < 0) return;
      order.splice(from, 1);
      order.splice(to, 0, source);
      next.navigation.order = order;
    });
  }

  async function moveAsset(source, targetPage, targetAsset) {
    if (!source || !targetPage) return;
    await WorkspaceEditor.mutate("图片位置已保存", (next) => {
      const from = next.assets.findIndex((asset) => asset.id === source);
      if (from < 0) return;
      const [asset] = next.assets.splice(from, 1);
      asset.pageId = targetPage;
      const target = targetAsset ? next.assets.findIndex((item) => item.id === targetAsset) : -1;
      if (target >= 0) next.assets.splice(target, 0, asset);
      else next.assets.push(asset);
    });
  }

  document.addEventListener("click", async (event) => {
    const control = event.target.closest("[data-action], [data-editor-action]");
    if (!control) return;
    const action = control.dataset.action;
    if (control.dataset.editorAction) return WorkspaceEditor.handleAction(control.dataset.editorAction);
    if (action === "home") navigate("home");
    if (action === "go") navigate(control.dataset.route);
    if (action === "edit-mode") WorkspaceEditor.isEditing() ? WorkspaceEditor.exit() : WorkspaceEditor.enter();
    if (action === "sidebar-toggle") { state.appearance.sidebarCollapsed = !state.appearance.sidebarCollapsed; render(); await save("边栏状态已保存"); }
    if (action === "mobile-menu") document.getElementById("sidebar")?.classList.add("open");
    if (action === "new-record") openRecordModal(control.dataset.module, "");
    if (action === "edit-record") openRecordModal(control.dataset.module, control.dataset.id);
    if (action === "delete-record") deleteRecord(control.dataset.module, control.dataset.id);
    if (action === "toggle-record") toggleRecord(control.dataset.module, control.dataset.id);
    if (action === "modal-close") closeModal();
    if (action === "hide-module") WorkspaceEditor.hideModule(control.dataset.module);
    if (action === "restore-module") { closeModal(); WorkspaceEditor.restoreModule(control.dataset.module); }
    if (action === "hide-action") WorkspaceEditor.hideAction(control.dataset.actionId);
    if (action === "restore-action") { closeModal(); WorkspaceEditor.restoreAction(control.dataset.actionId); }
    if (action === "image-size") WorkspaceEditor.resizeImage(control.dataset.id, control.dataset.size);
    if (action === "image-remove") WorkspaceEditor.removeImage(control.dataset.id);
    if (action === "backup-export") { WorkspaceBackup.download(state, config); await save("备份已导出"); }
    if (action === "import-apply") applyImport(control.dataset.mode);
    if (action === "snapshots") openSnapshots();
    if (action === "snapshot-restore") restoreSnapshot(control.dataset.id);
  });

  document.addEventListener("submit", (event) => {
    const form = event.target.closest("[data-record-form]");
    if (!form) return;
    event.preventDefault();
    submitRecord(form);
  });

  document.addEventListener("input", (event) => {
    if (!event.target.matches("[data-search]")) return;
    query = event.target.value;
    const active = document.activeElement;
    render();
    document.querySelector("[data-search]")?.focus();
    if (active?.selectionStart != null) document.querySelector("[data-search]")?.setSelectionRange(query.length, query.length);
  });

  document.addEventListener("change", async (event) => {
    if (event.target.matches("[data-filter]")) { filter = event.target.value; render(); }
    if (event.target.matches("[data-editor-image]")) { await WorkspaceEditor.addImage(event.target.files?.[0]); event.target.value = ""; }
    if (event.target.matches("[data-image-replace]")) { await WorkspaceEditor.replaceImage(event.target.dataset.imageReplace, event.target.files?.[0]); event.target.value = ""; }
    if (event.target.matches("[data-backup-file]")) {
      const file = event.target.files?.[0];
      if (!file) return;
      try { openImportPreview(WorkspaceBackup.parseText(await file.text(), config)); }
      catch (error) { toast(`导入失败：${error.message}`); }
      event.target.value = "";
    }
  });

  document.addEventListener("dragstart", (event) => {
    if (!WorkspaceEditor.isEditing()) return;
    const asset = event.target.closest("[data-asset-id]");
    const item = event.target.closest("[data-nav-id]");
    if (asset) {
      draggedAsset = asset.dataset.assetId;
      asset.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", `asset:${draggedAsset}`);
    } else if (item) {
      draggedNav = item.dataset.navId;
      item.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", `nav:${draggedNav}`);
    }
  });
  document.addEventListener("dragover", (event) => {
    if (!WorkspaceEditor.isEditing()) return;
    const slot = event.target.closest("[data-image-slot]");
    const item = event.target.closest("[data-nav-id]");
    if (!item && !slot) return;
    event.preventDefault();
    document.querySelectorAll(".drop-target").forEach((node) => node.classList.remove("drop-target"));
    (draggedAsset ? slot : item)?.classList.add("drop-target");
  });
  document.addEventListener("drop", (event) => {
    if (!WorkspaceEditor.isEditing()) return;
    const raw = event.dataTransfer.getData("text/plain");
    const slot = event.target.closest("[data-image-slot]");
    const item = event.target.closest("[data-nav-id]");
    if (raw.startsWith("asset:") && slot) {
      event.preventDefault();
      moveAsset(raw.slice(6) || draggedAsset, slot.dataset.imageSlot, event.target.closest("[data-asset-id]")?.dataset.assetId || "");
    } else if (raw.startsWith("nav:") && item) {
      event.preventDefault();
      reorderNavigation(raw.slice(4) || draggedNav, item.dataset.navId);
    }
  });
  document.addEventListener("dragend", () => {
    draggedNav = "";
    draggedAsset = "";
    document.querySelectorAll(".dragging, .drop-target").forEach((node) => node.classList.remove("dragging", "drop-target"));
  });

  document.addEventListener("keydown", (event) => {
    const typing = event.target.matches("input, textarea, select, [contenteditable='true']");
    if (!typing && (event.key === "e" || event.key === "E")) { event.preventDefault(); WorkspaceEditor.enter(); }
    if (event.key === "Escape") { if (currentModal) closeModal(); else WorkspaceEditor.exit(); }
    if (WorkspaceEditor.isEditing() && !typing && (event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z") { event.preventDefault(); event.shiftKey ? WorkspaceEditor.redo() : WorkspaceEditor.undo(); }
  });

  window.addEventListener("hashchange", () => {
    route = parseRoute();
    query = "";
    filter = "全部";
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  WorkspaceStore.init(config).then((loaded) => {
    state = loaded;
    WorkspaceEditor.init({
      getState: () => state,
      setState: (next) => { state = next; },
      getTemplate: () => config,
      getRoute: () => route,
      render,
      save,
      toast,
      openHiddenModules
    });
    render();
    saveStatus = { type: "ok", label: "已保存到本机" };
    updateSaveBadge();
  }).catch((error) => {
    app.innerHTML = `<main class="home-hero"><div class="card"><h1>工作台启动失败</h1><p>${esc(error.message || "无法读取本地数据")}</p></div></main>`;
  });
})();

</script>
</body>
</html>
